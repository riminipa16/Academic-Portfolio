<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteering | Most Rimi Moni</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="volunteering" class="text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="blob w-72 h-72 bg-indigo-600 -top-20 -left-10" style="opacity:.25"></div>
    <div class="absolute inset-0 bg-grid opacity-60"></div>
    <div class="relative max-w-5xl mx-auto px-6 py-14">
      <p class="reveal text-xs text-slate-500"><a href="index.html" class="hover:text-indigo-400">Home</a> / Volunteering</p>
      <h1 class="reveal font-display text-4xl md:text-5xl font-semibold text-white mt-3" style="--d:.05s">Volunteering</h1>
      <p class="reveal text-slate-400 mt-3 max-w-xl" style="--d:.1s">Community and service activities.</p>
    </div>
  </section>

  <main class="max-w-5xl mx-auto px-6 py-14 space-y-8">
    <div id="vol-list" class="timeline space-y-6"></div>
    <div class="flex justify-between pt-6 text-sm">
      <a href="experience.html" class="text-slate-400 hover:text-indigo-400 transition"><i class="fas fa-arrow-left mr-1"></i> Experience</a>
      <a href="contact.html" class="text-indigo-400 hover:text-indigo-300 transition">Contact <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/extra-data.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    document.getElementById("vol-list").innerHTML = VOLUNTEERING.length ? VOLUNTEERING.map((v, i) => `
      <div class="timeline-item reveal-left" style="--d:${i * 0.1}s">
        <div class="card spot p-6">
          <span class="chip mb-2">${esc(v.date)}</span>
          <h2 class="font-bold text-white">${esc(v.role)}</h2>
          <p class="text-indigo-300 text-sm">${esc(v.org)}</p>
          ${(v.details || []).length ? `<ul class="mt-3 space-y-2 text-sm text-slate-300">${v.details.map((d) => `<li class="flex gap-3"><i class="fas fa-circle-check text-indigo-400 mt-1"></i>${esc(d)}</li>`).join("")}</ul>` : ""}
        </div>
      </div>`).join("")
      : `<p class="text-slate-400 text-sm">No volunteering added yet. Add entries in assets/extra-data.js.</p>`;
    window.revealScan();
  </script>
</body>
</html>
