<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awards | Most Rimi Moni</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="awards" class="text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="blob w-72 h-72 bg-indigo-600 -top-20 -left-10" style="opacity:.25"></div>
    <div class="absolute inset-0 bg-grid opacity-60"></div>
    <div class="relative max-w-5xl mx-auto px-6 py-14">
      <p class="reveal text-xs text-slate-500"><a href="index.html" class="hover:text-indigo-400">Home</a> / Awards</p>
      <h1 class="reveal font-display text-4xl md:text-5xl font-semibold text-white mt-3" style="--d:.05s">Awards &amp; Honors</h1>
      <p class="reveal text-slate-400 mt-3 max-w-xl" style="--d:.1s">Recognition from programming contests and mathematics competitions.</p>
    </div>
  </section>

  <main class="max-w-5xl mx-auto px-6 py-14 space-y-8">
    <div id="award-grid" class="grid md:grid-cols-2 gap-6"></div>
    <div class="flex justify-between pt-6 text-sm">
      <a href="experience.html" class="text-slate-400 hover:text-indigo-400 transition"><i class="fas fa-arrow-left mr-1"></i> Experience</a>
      <a href="documents.html" class="text-indigo-400 hover:text-indigo-300 transition">Documents <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/extra-data.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    document.getElementById("award-grid").innerHTML = AWARDS.map((a, i) => `
      <article class="card spot reveal p-7 flex gap-5" style="--d:${(i % 2) * 0.1}s">
        <div class="icon-badge shrink-0" style="width:3.5rem;height:3.5rem"><i class="fas ${esc(a.icon || "fa-award")} text-xl"></i></div>
        <div>
          <span class="chip mb-2">${esc(a.date)}</span>
          <h2 class="font-display text-xl font-semibold text-white">${esc(a.title)}</h2>
          <p class="text-indigo-300 text-sm mt-1">${esc(a.event)}</p>
          ${a.org ? `<p class="text-xs text-slate-500 mt-0.5">${esc(a.org)}</p>` : ""}
          ${a.text ? `<p class="text-sm text-slate-400 mt-3 leading-relaxed">${esc(a.text)}</p>` : ""}
        </div>
      </article>`).join("");
    window.revealScan();
  </script>
</body>
</html>
