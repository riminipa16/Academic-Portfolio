<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certifications | Most Rimi Moni</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="certifications" class="text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="blob w-72 h-72 bg-indigo-600 -top-20 -left-10" style="opacity:.25"></div>
    <div class="absolute inset-0 bg-grid opacity-60"></div>
    <div class="relative max-w-5xl mx-auto px-6 py-14">
      <p class="reveal text-xs text-slate-500"><a href="index.html" class="hover:text-indigo-400">Home</a> / Certifications</p>
      <h1 class="reveal font-display text-4xl md:text-5xl font-semibold text-white mt-3" style="--d:.05s">Certifications</h1>
      <p class="reveal text-slate-400 mt-3 max-w-xl" style="--d:.1s">Courses and credentials that support my studies.</p>
    </div>
  </section>

  <main class="max-w-5xl mx-auto px-6 py-14 space-y-8">
    <div id="cert-grid" class="grid md:grid-cols-2 gap-6"></div>
    <div class="flex justify-between pt-6 text-sm">
      <a href="awards.html" class="text-slate-400 hover:text-indigo-400 transition"><i class="fas fa-arrow-left mr-1"></i> Awards</a>
      <a href="documents.html" class="text-indigo-400 hover:text-indigo-300 transition">Documents <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/extra-data.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const grid = document.getElementById("cert-grid");
    grid.innerHTML = CERTIFICATIONS.length ? CERTIFICATIONS.map((c, i) => `
      <article class="card spot reveal p-6 flex flex-col gap-3" style="--d:${(i % 2) * 0.1}s">
        <div class="flex items-start gap-4">
          <div class="icon-badge shrink-0"><i class="fas fa-certificate"></i></div>
          <div>
            <span class="chip mb-2">${esc(c.date)}</span>
            <h2 class="font-bold text-white">${esc(c.title)}</h2>
            <p class="text-indigo-300 text-sm mt-0.5">${esc(c.issuer)}</p>
          </div>
        </div>
        <div class="flex gap-3 text-sm pt-1">
          ${c.file ? `<a href="${esc(c.file)}" target="_blank" class="text-indigo-400 hover:text-indigo-300"><i class="fas fa-file-pdf mr-1"></i> View certificate</a>` : ""}
          ${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300"><i class="fas fa-arrow-up-right-from-square mr-1"></i> Verify</a>` : ""}
        </div>
      </article>`).join("")
      : `<p class="text-slate-400 text-sm md:col-span-2">No certifications added yet. Add them in assets/extra-data.js.</p>`;
    window.revealScan();
  </script>
</body>
</html>
